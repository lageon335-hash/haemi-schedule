<html lang="ko">
<head>

  <style>
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100%; }
    body { margin: 0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; background: #f4f1ea; color: #222; }
    .header { position: relative; overflow: hidden; background: linear-gradient(135deg, #11203f 0%, #1a2f57 100%); padding: 28px 24px 60px; color: #fff; }
    .header-inner { position: relative; z-index: 1; }
    .brand { margin: 0 0 6px; font-size: 12px; letter-spacing: 2px; color: #e8b45a; font-weight: 600; }
    .title { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
    .subtitle { margin: 0; font-size: 13px; color: #b9c3d9; }
    .month-nav { position: relative; z-index: 1; display: flex; align-items: center; gap: 16px; margin-top: 20px; }
    .nav-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); color: #fff; font-size: 16px; cursor: pointer; }
    .month-label { font-size: 18px; font-weight: 700; }
    .card { position: relative; z-index: 2; margin: -32px 12px 24px; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 16px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
    .status-text { font-size: 13px; color: #2e9e5b; }
    .status-text.saving { color: #b8860b; }
    .status-text.error { color: #c0392b; }
    .toolbar-actions { display: flex; gap: 8px; }
    .btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
    .btn-secondary { background: #eef0f4; color: #333; }
    .btn-primary { background: #2b3a5c; color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-text { background: none; border: none; color: #cfd6e6; font-size: 13px; cursor: pointer; text-decoration: underline; }

    .hint { font-size: 11px; color: #999; margin: 0 0 8px; }

    .schedule-scroll { overflow-x: auto; border: 1px solid #eee; border-radius: 10px; -webkit-overflow-scrolling: touch; }
    .schedule-table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 11px; }
    .schedule-table th, .schedule-table td { border: 1px solid #eee; padding: 6px 3px; text-align: center; white-space: nowrap; }
    .schedule-table thead th { background: #f7f7f5; font-weight: 700; }
    .day-head-num { display: block; font-size: 11px; }
    .day-head-wd { display: block; font-size: 9px; color: #999; font-weight: 400; }
    .day-head-wd.sun { color: #c0392b; }
    .day-head-wd.sat { color: #2f5aa8; }
    .day-col { min-width: 30px; }
    .day-col.today { background: #eef2fb; }

    .sticky-col { position: sticky; left: 0; z-index: 2; background: #fff; text-align: left; padding-left: 10px; font-weight: 600; min-width: 92px; }
    .schedule-table thead .sticky-col { background: #f7f7f5; z-index: 3; }

    .sched-cell { cursor: pointer; font-weight: 700; }
    .status-출근 { background: #eaf7ec; color: #2e9e5b; }
    .status-출장 { background: #e8f0fb; color: #2f5aa8; }
    .status-연차 { background: #fdf2e3; color: #b8720b; }
    .status-교육 { background: #f2ecfa; color: #7748b8; }
    .status-반차 { background: #fbe8f2; color: #c23a7a; }
    .status-휴무 { background: #f1f1f1; color: #888; }

    .legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 4px 4px; font-size: 12px; color: #444; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-출근 { background: #2e9e5b; }
    .dot-출장 { background: #2f5aa8; }
    .dot-연차 { background: #b8720b; }
    .dot-교육 { background: #7748b8; }
    .dot-반차 { background: #c23a7a; }
    .dot-휴무 { background: #888; }

    .summary { margin: 20px 12px 24px; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 16px; }
    .summary h3 { margin: 0 0 12px; font-size: 15px; }
    .summary-scroll { overflow-x: auto; }
    .summary table { border-collapse: collapse; width: 100%; font-size: 12px; min-width: 480px; }
    .summary th, .summary td { border: 1px solid #eee; padding: 8px 6px; text-align: center; white-space: nowrap; }
    .summary th { background: #f7f7f5; font-weight: 700; }
    .summary td:first-child, .summary th:first-child { text-align: left; font-weight: 600; }

    .install-banner { position: fixed; left: 12px; right: 12px; bottom: 16px; background: #11203f; color: #fff; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 10; }
    .install-banner[hidden] { display: none; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <p class="brand">HAEMI / YONGSEONG SOLAR</p>
      <h1 class="title">월간 근무계획표</h1>
      <p class="subtitle">해미/용성솔라 · 직원 근무 · 출장 · 연차 · 교육 일정 관리</p>
    </div>
    <div class="month-nav">
      <button id="prevMonth" class="nav-btn" aria-label="이전 달">‹</button>
      <span id="monthLabel" class="month-label">2026년 8월</span>
      <button id="nextMonth" class="nav-btn" aria-label="다음 달">›</button>
    </div>
  </header>

  <main class="card">
    <div class="toolbar">
      <span id="statusText" class="status-text">불러오는 중...</span>
      <div class="toolbar-actions">
        <button id="mailBtn" class="btn btn-secondary">메일 보내기</button>
        <button id="saveBtn" class="btn btn-primary">저장</button>
      </div>
    </div>

    <p class="hint">← 좌우로 스크롤하면 날짜 전체를 볼 수 있어요. 칸을 탭하면 상태가 바뀝니다.</p>

    <div class="schedule-scroll">
      <table class="schedule-table" id="scheduleTable">
        <thead>
          <tr id="scheduleHeadRow">
            <th class="sticky-col">직원</th>
          </tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
      </table>
    </div>

    <div class="legend">
      <span class="legend-item"><i class="dot dot-출근"></i>출근</span>
      <span class="legend-item"><i class="dot dot-출장"></i>출장</span>
      <span class="legend-item"><i class="dot dot-연차"></i>연차</span>
      <span class="legend-item"><i class="dot dot-교육"></i>교육</span>
      <span class="legend-item"><i class="dot dot-반차"></i>반차</span>
      <span class="legend-item"><i class="dot dot-휴무"></i>휴무</span>
    </div>
  </main>

  <div class="summary">
    <h3>이달 근무 요약</h3>
    <div class="summary-scroll">
      <table>
        <thead>
          <tr>
            <th>직원</th>
            <th>출근</th>
            <th>출장</th>
            <th>연차</th>
            <th>교육</th>
            <th>반차</th>
            <th>휴무</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

  <div id="installBanner" class="install-banner" hidden>
    <span>이 화면을 앱처럼 설치할 수 있어요</span>
    <button id="installBtn" class="btn btn-primary">앱으로 설치하기</button>
    <button id="installDismiss" class="btn-text">닫기</button>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw-XJ0DuFE2lluwgxpUo_d7GZkJX6i_DlFNegdKGEZVuecm_LZAChzJdvZZkAXV9Lv3nw/exec";
    const DEFAULT_EMPLOYEES = ["김선천소장", "손삼영실장", "황인용소장", "공석희실장"];
    const STATUS_CYCLE = ["출근", "출장", "연차", "교육", "반차", "휴무"];
    const WEEKDAY_LABELS = ["일", "월", "화", "수", "목", "금", "토"];

    let currentDate = new Date();
    let monthData = {};
    let dirty = false;

    const monthLabel = document.getElementById("monthLabel");
    const statusText = document.getElementById("statusText");
    const saveBtn = document.getElementById("saveBtn");
    const mailBtn = document.getElementById("mailBtn");
    const prevBtn = document.getElementById("prevMonth");
    const nextBtn = document.getElementById("nextMonth");
    const scheduleHeadRow = document.getElementById("scheduleHeadRow");
    const scheduleBody = document.getElementById("scheduleBody");
    const summaryBody = document.getElementById("summaryBody");

    function monthKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      return `haemi-schedule:${y}-${m}`;
    }

    function defaultDayEntries() {
      return DEFAULT_EMPLOYEES.map((name) => ({ name, status: "출근" }));
    }

    function getEntry(day, name) {
      if (!monthData[day]) monthData[day] = defaultDayEntries();
      let entry = monthData[day].find((e) => e.name === name);
      if (!entry) {
        entry = { name, status: "출근" };
        monthData[day].push(entry);
      }
      return entry;
    }

    async function loadMonth() {
      statusText.textContent = "불러오는 중...";
      statusText.className = "status-text saving";
      saveBtn.disabled = true;

      const key = monthKey(currentDate);
      try {
        const res = await fetch(`${GAS_API_URL}?action=get&key=${encodeURIComponent(key)}`);
        const json = await res.json();
        monthData = (json.ok && json.value) ? JSON.parse(json.value) : {};
        statusText.textContent = "모든 변경사항이 저장되었습니다";
        statusText.className = "status-text";
      } catch (err) {
        console.error(err);
        statusText.textContent = "불러오기 실패 - 네트워크를 확인하세요";
        statusText.className = "status-text error";
      } finally {
        saveBtn.disabled = false;
        dirty = false;
        renderAll();
      }
    }

    async function saveMonth() {
      const key = monthKey(currentDate);
      statusText.textContent = "저장 중...";
      statusText.className = "status-text saving";
      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ key, value: JSON.stringify(monthData) }),
        });
        statusText.textContent = "모든 변경사항이 저장되었습니다";
        statusText.className = "status-text";
        dirty = false;
      } catch (err) {
        console.error(err);
        statusText.textContent = "저장 실패 - 다시 시도해주세요";
        statusText.className = "status-text error";
      }
    }

    function renderSummary() {
      const counts = {};
      DEFAULT_EMPLOYEES.forEach((name) => {
        counts[name] = {};
        STATUS_CYCLE.forEach((s) => (counts[name][s] = 0));
      });

      Object.values(monthData).forEach((entries) => {
        entries.forEach((e) => {
          if (counts[e.name] && typeof counts[e.name][e.status] === "number") {
            counts[e.name][e.status]++;
          }
        });
      });

      summaryBody.innerHTML = "";
      DEFAULT_EMPLOYEES.forEach((name) => {
        const row = document.createElement("tr");
        const cells = [name, ...STATUS_CYCLE.map((s) => counts[name][s])];
        row.innerHTML = cells.map((c) => `<td>${c}</td>`).join("");
        summaryBody.appendChild(row);
      });
    }

    function renderSchedule() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      scheduleHeadRow.innerHTML = '<th class="sticky-col">직원</th>';
      for (let day = 1; day <= daysInMonth; day++) {
        const dow = new Date(year, month, day).getDay();
        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        const th = document.createElement("th");
        th.className = "day-col" + (isToday ? " today" : "");
        th.innerHTML = `<span class="day-head-num">${day}</span><span class="day-head-wd ${dow === 0 ? "sun" : dow === 6 ? "sat" : ""}">${WEEKDAY_LABELS[dow]}</span>`;
        scheduleHeadRow.appendChild(th);
      }

      scheduleBody.innerHTML = "";
      DEFAULT_EMPLOYEES.forEach((name) => {
        const tr = document.createElement("tr");
        const nameTd = document.createElement("td");
        nameTd.className = "sticky-col";
        nameTd.textContent = name;
        tr.appendChild(nameTd);

        for (let day = 1; day <= daysInMonth; day++) {
          const entry = getEntry(day, name);
          const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
          const td = document.createElement("td");
          td.className = `sched-cell day-col status-${entry.status}` + (isToday ? " today" : "");
          td.textContent = entry.status.slice(0, 1);
          td.title = `${day}일 · ${name} · ${entry.status}`;

          td.addEventListener("click", () => {
            const curIdx = STATUS_CYCLE.indexOf(entry.status);
            entry.status = STATUS_CYCLE[(curIdx + 1) % STATUS_CYCLE.length];
            dirty = true;
            statusText.textContent = "저장되지 않은 변경사항이 있습니다";
            statusText.className = "status-text saving";
            renderAll();
          });

          tr.appendChild(td);
        }

        scheduleBody.appendChild(tr);
      });
    }

    function renderAll() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      monthLabel.textContent = `${year}년 ${month + 1}월`;
      renderSchedule();
      renderSummary();
    }

    prevBtn.addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
      loadMonth();
    });
    nextBtn.addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
      loadMonth();
    });
    saveBtn.addEventListener("click", saveMonth);

    mailBtn.addEventListener("click", () => {
      const subject = encodeURIComponent(`${monthLabel.textContent} 근무계획표`);
      const body = encodeURIComponent(
        Object.entries(monthData)
          .map(([day, entries]) => `${day}일: ` + entries.map((e) => `${e.name}(${e.status})`).join(", "))
          .join("\n")
      );
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
    });

    window.addEventListener("beforeunload", (e) => {
      if (dirty) { e.preventDefault(); e.returnValue = ""; }
    });

    loadMonth();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(console.error);
      });
    }

    let deferredPrompt = null;
    const installBanner = document.getElementById("installBanner");
    const installBtn = document.getElementById("installBtn");
    const installDismiss = document.getElementById("installDismiss");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.hidden = false;
    });
    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBanner.hidden = true;
    });
    installDismiss.addEventListener("click", () => { installBanner.hidden = true; });
  </script>
</body>
</html>

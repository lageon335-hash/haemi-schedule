<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>해미/용성솔라 근무계획표</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#11203f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="근무계획표">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAYAAAA9zQYyAAAFPUlEQVR4nO3dsW4bRxCA4aVjNwaSPuXlUgSGqxRJm760qYIiT8G8Rl4gRWq9QoDAaB07jSjrEnrBw+7O7v/VNiAcJZ9ndrigsFqW5U8AKM8+egIAcyRoIIqggSiCBqIIGogiaCCKoIEoggaiCBqIIugFrNfr5cePH0uZbrfb0lNzB18++PBLuFwuS/lXbTabpUyz2azUeMSTgz3d1yWy8UsAAAAASUVORK5CYII=">

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; background: #f4f1ea; color: #222; }
    .header { position: relative; overflow: hidden; background: linear-gradient(135deg, #11203f 0%, #1a2f57 100%); padding: 28px 24px 60px; color: #fff; }
    .sun { position: absolute; top: -60px; right: -40px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #f2b155, #b9793a 70%); opacity: 0.9; }
    .header-inner { position: relative; z-index: 1; }
    .brand { margin: 0 0 6px; font-size: 12px; letter-spacing: 2px; color: #e8b45a; font-weight: 600; }
    .title { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
    .subtitle { margin: 0; font-size: 13px; color: #b9c3d9; }
    .month-nav { position: relative; z-index: 1; display: flex; align-items: center; gap: 16px; margin-top: 20px; }
    .nav-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); color: #fff; font-size: 16px; cursor: pointer; }
    .month-label { font-size: 18px; font-weight: 700; }
    .card { position: relative; z-index: 2; margin: -32px 12px 24px; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 16px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
    .status-text { font-size: 13px; color: #2e9e5b; }
    .status-text.saving { color: #b8860b; }
    .status-text.error { color: #c0392b; }
    .toolbar-actions { display: flex; gap: 8px; }
    .btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
    .btn-secondary { background: #eef0f4; color: #333; }
    .btn-primary { background: #2b3a5c; color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 2px; font-size: 12px; font-weight: 700; color: #666; }
    .weekday { text-align: left; padding-left: 4px; }
    .weekday.sun { color: #c0392b; }
    .weekday.sat { color: #2f5aa8; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .day-cell { min-height: 90px; border: 1px solid #eee; border-radius: 10px; padding: 6px; background: #fff; }
    .day-cell.empty { background: transparent; border: none; }
    .day-cell.today { border-color: #2b3a5c; }
    .day-num { font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #333; }
    .day-num.sun { color: #c0392b; }
    .day-num.sat { color: #2f5aa8; }
    .entry-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; padding: 2px 4px; border-radius: 5px; margin-bottom: 2px; cursor: pointer; background: #eef7ee; }
    .entry-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #234; }
    .entry-status { font-weight: 700; padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
    .status-출근 { background: #eaf7ec; } .status-출근 .entry-status { color: #2e9e5b; }
    .status-연차 { background: #fdf2e3; } .status-연차 .entry-status { color: #b8720b; }
    .status-출장 { background: #e8f0fb; } .status-출장 .entry-status { color: #2f5aa8; }
    .status-교육 { background: #f2ecfa; } .status-교육 .entry-status { color: #7748b8; }
    .status-휴무 { background: #f1f1f1; } .status-휴무 .entry-status { color: #888; }
    .install-banner { position: fixed; left: 12px; right: 12px; bottom: 16px; background: #11203f; color: #fff; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 10; }
    @media (max-width: 420px) { .day-cell { min-height: 78px; } .entry-row { font-size: 9px; } }
  </style>
</head>
<body>

  <header class="header">
    <div class="sun"></div>
    <div class="header-inner">
      <p class="brand">HAEMI / YONGSEONG SOLAR</p>
      <h1 class="title">월간 근무계획표</h1>
      <p class="subtitle">해미/용성솔라 · 직원 근무 · 출장 · 연차 · 교육 일정 관리</p>
    </div>
    <div class="month-nav">
      <button id="prevMonth" class="nav-btn" aria-label="이전 달">‹</button>
      <span id="monthLabel" class="month-label">2026년 8월</span>
      <button id="nextMonth" class="nav-btn" aria-label="다음 달">›</button>
    </div>
  </header>

  <main class="card">
    <div class="toolbar">
      <span id="statusText" class="status-text">불러오는 중...</span>
      <div class="toolbar-actions">
        <button id="mailBtn" class="btn btn-secondary">메일 보내기</button>
        <button id="saveBtn" class="btn btn-primary">저장</button>
      </div>
    </div>

    <div class="weekday-row">
      <span class="weekday sun">일</span>
      <span class="weekday">월</span>
      <span class="weekday">화</span>
      <span class="weekday">수</span>
      <span class="weekday">목</span>
      <span class="weekday">금</span>
      <span class="weekday sat">토</span>
    </div>

    <div id="calendarGrid" class="calendar-grid"></div>
  </main>

  <div id="installBanner" class="install-banner" hidden>
    <span>이 화면을 앱처럼 설치할 수 있어요</span>
    <button id="installBtn" class="btn btn-primary">앱으로 설치하기</button>
    <button id="installDismiss" class="btn-text">닫기</button>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzzmvnHfEQUDdZx3Zsw1x7uKjCMa-0fulRuhzOcgQr2S89PoMFEu-Zq2H7ijt_tVjtV/exec";
    const DEFAULT_EMPLOYEES = ["김선천소장", "손삼영실장", "황인용소장", "공석희실장"];
    const STATUS_CYCLE = ["출근", "연차", "출장", "교육", "휴무"];

    let currentDate = new Date();
    let monthData = {};
    let dirty = false;

    const monthLabel = document.getElementById("monthLabel");
    const calendarGrid = document.getElementById("calendarGrid");
    const statusText = document.getElementById("statusText");
    const saveBtn = document.getElementById("saveBtn");
    const mailBtn = document.getElementById("mailBtn");
    const prevBtn = document.getElementById("prevMonth");
    const nextBtn = document.getElementById("nextMonth");

    function monthKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      return `haemi-schedule:${y}-${m}`;
    }

    function defaultDayEntries() {
      return DEFAULT_EMPLOYEES.map((name) => ({ name, status: "출근" }));
    }

    async function loadMonth() {
      statusText.textContent = "불러오는 중...";
      statusText.className = "status-text saving";
      saveBtn.disabled = true;

      const key = monthKey(currentDate);
      try {
        const res = await fetch(`${GAS_API_URL}?action=get&key=${encodeURIComponent(key)}`);
        const json = await res.json();
        monthData = (json.ok && json.value) ? JSON.parse(json.value) : {};
        statusText.textContent = "모든 변경사항이 저장되었습니다";
        statusText.className = "status-text";
      } catch (err) {
        console.error(err);
        statusText.textContent = "불러오기 실패 - 네트워크를 확인하세요";
        statusText.className = "status-text error";
      } finally {
        saveBtn.disabled = false;
        dirty = false;
        renderCalendar();
      }
    }

    async function saveMonth() {
      const key = monthKey(currentDate);
      statusText.textContent = "저장 중...";
      statusText.className = "status-text saving";
      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ key, value: JSON.stringify(monthData) }),
        });
        statusText.textContent = "모든 변경사항이 저장되었습니다";
        statusText.className = "status-text";
        dirty = false;
      } catch (err) {
        console.error(err);
        statusText.textContent = "저장 실패 - 다시 시도해주세요";
        statusText.className = "status-text error";
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      monthLabel.textContent = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      calendarGrid.innerHTML = "";

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day-cell empty";
        calendarGrid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        const dow = new Date(year, month, day).getDay();
        cell.className = "day-cell";

        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        if (isToday) cell.classList.add("today");

        const numEl = document.createElement("div");
        numEl.className = "day-num" + (dow === 0 ? " sun" : dow === 6 ? " sat" : "");
        numEl.textContent = day;
        cell.appendChild(numEl);

        if (!monthData[day]) {
          monthData[day] = defaultDayEntries();
        }

        monthData[day].forEach((entry, idx) => {
          const row = document.createElement("div");
          row.className = `entry-row status-${entry.status}`;

          const nameEl = document.createElement("span");
          nameEl.className = "entry-name";
          nameEl.textContent = entry.name;

          const statusEl = document.createElement("span");
          statusEl.className = "entry-status";
          statusEl.textContent = entry.status;

          row.appendChild(nameEl);
          row.appendChild(statusEl);

          row.addEventListener("click", () => {
            const curIdx = STATUS_CYCLE.indexOf(entry.status);
            const nextStatus = STATUS_CYCLE[(curIdx + 1) % STATUS_CYCLE.length];
            monthData[day][idx].status = nextStatus;
            dirty = true;
            statusText.textContent = "저장되지 않은 변경사항이 있습니다";
            statusText.className = "status-text saving";
            renderCalendar();
          });

          cell.appendChild(row);
        });

        calendarGrid.appendChild(cell);
      }
    }

    prevBtn.addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
      loadMonth();
    });
    nextBtn.addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
      loadMonth();
    });
    saveBtn.addEventListener("click", saveMonth);

    mailBtn.addEventListener("click", () => {
      const subject = encodeURIComponent(`${monthLabel.textContent} 근무계획표`);
      const body = encodeURIComponent(
        Object.entries(monthData)
          .map(([day, entries]) => `${day}일: ` + entries.map((e) => `${e.name}(${e.status})`).join(", "))
          .join("\n")
      );
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
    });

    window.addEventListener("beforeunload", (e) => {
      if (dirty) { e.preventDefault(); e.returnValue = ""; }
    });

    loadMonth();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(console.error);
      });
    }

    let deferredPrompt = null;
    const installBanner = document.getElementById("installBanner");
    const installBtn = document.getElementById("installBtn");
    const installDismiss = document.getElementById("installDismiss");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.hidden = false;
    });
    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBanner.hidden = true;
    });
    installDismiss.addEventListener("click", () => { installBanner.hidden = true; });
  </script>
</body>
</html>
